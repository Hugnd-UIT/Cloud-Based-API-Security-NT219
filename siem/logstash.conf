input {
  beats { 
    port => 5044
    ssl => true 
    ssl_verify_mode => "force_peer" 
    ssl_key => "/tmpfs/certs/server.key"
    ssl_certificate => "/tmpfs/certs/server.crt"
    ssl_certificate_authorities => ["/etc/ssl/certs/ca.crt"]
  }
}

output {
  elasticsearch {
    user => "elastic"
    password => "${ELK_PASSWORD}"
    hosts => ["https://elasticsearch:9200"] 
    index => "siem-logs-%{+YYYY.MM.dd}"
    cacert => "/etc/ssl/certs/ca.crt"
    ssl => true
  }
}