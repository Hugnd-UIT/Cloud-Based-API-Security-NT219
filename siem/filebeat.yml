filebeat.inputs:
- type: container
  paths: ['/var/lib/docker/containers/*/*.log']
processors:
  - add_docker_metadata:
      host: "unix:///var/run/docker.sock"
output.logstash:
  hosts: ["logstash:5044"]
  ssl.certificate_authorities: ["/etc/certs/ca.crt"]
  ssl.certificate: "/tmpfs/certs/server.crt"
  ssl.key: "/tmpfs/certs/server.key"
  ssl.verification_mode: "certificate"