_format_version: "3.0"
_transform: true

services:
  - name: laravel-api-service
    url: "http://payshield_app:80"
    routes:
      - name: laravel-api-route
        paths:
          - /api
        strip_path: false

    plugins:
      - name: rate-limiting
        config:
          minute: 10
          policy: local
      
      - name: jwt
        config:
          claims_to_verify:
            - exp

      - name: cors
        config:
          origins:
            - "http://localhost:6868"
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
          headers:
            - Accept
            - Accept-Version
            - Content-Length
            - Content-MD5
            - Content-Type
            - Date
            - Authorization
          credentials: true

  - name: keycloak-service
    url: http://payshield_keycloak:8080
    routes:
      - name: keycloak-route
        paths:          
          - /realms
        strip_path: false
        preserve_host: true
    plugins:
      - name: rate-limiting
        config:
          minute: 5 
          policy: local

consumers:                                                
  - username: payshield-users
    jwt_secrets:
      - algorithm: RS256
        secret: "{vault://hcv/secret/payshield?key=CLIENT_SECRET}"
        key: "http://localhost:8888/realms/payshield-realm"
        rsa_public_key: |
          -----BEGIN PUBLIC KEY-----
          
          -----END PUBLIC KEY-----
