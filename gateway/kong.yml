_format_version: "3.0"
_transform: true

upstreams:
  - name: laravel_upstream
    targets:
      - target: payshield_nginx:8443

services:
  - name: laravel-api-service
    url: "https://laravel_upstream"
    routes:
      - name: laravel-api-route
        paths:
          - /api
        strip_path: false
    plugins:
      - name: rate-limiting
        config:
          minute: 10
          policy: local
      - name: cors
        config:
          origins:
            - "http://localhost:6868"
          methods:
            - "GET"
            - "POST"
            - "PUT"
            - "PATCH"
            - "DELETE"
          headers:
            - "Accept"
            - "Accept-Version"
            - "Content-Length"
            - "Content-MD5"
            - "Content-Type"
            - "Date"
            - "Authorization"
          credentials: true

consumers:
  - username: payshield-users
    jwt_secrets:
      - algorithm: RS256
        key: "http://localhost:8888/realms/payshield-realm"
        secret: "{vault://env/secret/payshield?key=CLIENT_SECRET}"
