_format_version: "3.0"
_transform: true

services:
  - name: services
    url: "https://proxy:8443"

    routes:
      - name: laravel-api-route
        paths:
          - /api
        strip_path: false

        plugins:
          - name: rate-limiting
            config:
              minute: 10
              policy: local

          - name: opa
            config:
              opa_server: "https://opa:8181"
              opa_path: "/v1/data/payshield/authz"

      - name: vnpay-ipn-route
        paths:
          - /api/vnpay-ipn
        methods:
          - GET
        strip_path: false

        plugins:
          - name: rate-limiting
            config:
              minute: 20
              policy: local

      - name: vnpay-return-route
        paths:
          - /api/vnpay-return
        methods:
          - GET
        strip_path: false

        plugins:
          - name: rate-limiting
            config:
              minute: 20
              policy: local