_format_version: "3.0"
_transform: true

services:
  - name: laravel-api-service
    url: "https://nginx:8443"
    routes:
      - name: laravel-api-route
        paths:
          - /api
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 10
              policy: local
          - name: cors
            config:
              origins: ["http://localhost:6868"]
              methods: ["GET", "POST", "PUT", "PATCH", "DELETE"]
              headers: ["Accept", "Accept-Version", "Content-Length", "Content-MD5", "Content-Type", "Date", "Authorization"]
              credentials: true
          - name: jwt
          - name: opa
            config:
              opa_server: "https://opa:8181"
              opa_path: "/v1/data/payshield/authz"

      - name: vnpay-ipn-route
        paths:
          - /api/vnpay-ipn
        strip_path: false
        methods:
          - GET
        plugins:
          - name: rate-limiting
            config:
              minute: 20
              policy: local
      
      - name: vnpay-return-route
        paths:
          - /api/vnpay-return
        strip_path: false
        methods:
          - GET
        plugins:
          - name: rate-limiting
            config:
              minute: 20
              policy: local

consumers:
  - username: payshield-users
    jwt_secrets:
      - algorithm: RS256
        key: "https://localhost:8444/realms/payshield-realm"
        secret: "{vault://env/secret/payshield?key=CLIENT_SECRET}"
        rsa_public_key: |
