_format_version: "3.0"
_transform: true

services:
  - name: services
    url: "https://proxy:8443"

    routes:
      - name: laravel-api-route
        paths:
          - /api
        strip_path: false

        plugins:
          - name: rate-limiting
            config:
              minute: 10
              policy: local

          - name: pre-function
            config:
              access:
                - |
                  local auth = kong.request.get_header("Authorization")
                  if not auth or auth == "" then
                    return kong.response.exit(302, "Redirect to Keycloak", {
                      ["Location"] = "https://payshield.duckdns.org:8444/realms/payshield-realm/protocol/openid-connect/auth?response_type=code&client_id=payshield-app&scope=openid&redirect_uri=https%3A%2F%2Foauth.pstmn.io%2Fv1%2Fcallback&code_challenge=A_nlPiThaeFZWLUN26JhiEuclHPNfeqJDXIUGo5YM4I&code_challenge_method=S256"
                    })
                  end 
      - name: vnpay-ipn-route
        paths:
          - /api/vnpay-ipn
        methods:
          - GET
        strip_path: false

        plugins:
          - name: rate-limiting
            config:
              minute: 20
              policy: local

      - name: vnpay-return-route
        paths:
          - /api/vnpay-return
        methods:
          - GET
        strip_path: false

        plugins:
          - name: rate-limiting
            config:
              minute: 20
              policy: local
