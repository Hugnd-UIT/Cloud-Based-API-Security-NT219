server {
    listen 8443 ssl;
    server_name api.payshield.local localhost;

    ssl_certificate /etc/nginx/certs/waf.crt;
    ssl_certificate_key /etc/nginx/certs/waf.key;

    ssl_client_certificate /etc/nginx/certs/ca.crt;
    ssl_verify_client on; 
    ssl_verify_depth 2;

    proxy_ssl_verify off;
    proxy_ssl_server_name on;
    proxy_ssl_name "payshield_kong";
    
    proxy_ssl_certificate /etc/nginx/certs/waf.crt;
    proxy_ssl_certificate_key /etc/nginx/certs/waf.key;

    location / {
        proxy_pass https://payshield_kong:8443;
        proxy_set_header X-Forwarded-Client-Cert $ssl_client_escaped_cert;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}