services:

  vault:
    image: hashicorp/vault:1.13.3
    container_name: payshield_vault
    ports:
      - "8200:8200"
    environment:
      VAULT_LOCAL_CONFIG: >
        {"storage":{"file":{"path":"/vault/file"}},
         "listener":{"tcp":{"address":"0.0.0.0:8200","tls_disable":"0",
         "tls_cert_file":"/vault/certs/vault.crt",
         "tls_key_file":"/vault/certs/vault.key"}},
         "ui":true,"disable_mlock":true}
    cap_add:
      - IPC_LOCK
    command: server
    volumes:
      - payshield_vault_data:/vault/file
      - ./cert/ca.crt:/vault/certs/ca.crt:ro
      - ./cert/vault.crt:/vault/certs/vault.crt:ro
      - ./key/vault.key:/vault/certs/vault.key:ro


  db:
    image: mysql:8.0
    container_name: payshield_db
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    command:
      - --ssl-ca=/etc/mysql/certs/ca.crt
      - --ssl-cert=/etc/mysql/certs/server.crt
      - --ssl-key=/etc/mysql/certs/server.key
      - --require_secure_transport=ON
    volumes:
      - ./cert/ca.crt:/etc/mysql/certs/ca.crt:ro
      - ./cert/db_server.crt:/etc/mysql/certs/server.crt:ro
      - ./key/db_server.key:/etc/mysql/certs/server.key:ro
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql


  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: payshield_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true

      # HTTP
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.key=certs/elk.key
      - xpack.security.http.ssl.certificate=certs/elk.crt
      - xpack.security.http.ssl.certificate_authorities=certs/ca.crt
      - xpack.security.http.ssl.client_authentication=required

      # TRANSPORT
      - xpack.security.transport.ssl.enabled=true
      - xpack.security.transport.ssl.key=certs/elk.key
      - xpack.security.transport.ssl.certificate=certs/elk.crt
      - xpack.security.transport.ssl.certificate_authorities=certs/ca.crt

      - VAULT_TOKEN=${VAULT_APP_TOKEN}
    volumes:
      - ./cert/ca.crt:/usr/share/elasticsearch/config/certs/ca.crt:ro
      - ./cert/elk.crt:/usr/share/elasticsearch/config/certs/elk.crt:ro
      - ./key/elk.key:/usr/share/elasticsearch/config/certs/elk.key:ro
    command: >
      sh -c "
      export ELASTIC_PASSWORD=$$(curl -s -k -H \"X-Vault-Token: $$VAULT_TOKEN\"
      https://payshield_vault:8200/v1/secret/data/payshield
      | jq -r '.data.data.ELK_PASSWORD');
      exec /usr/local/bin/docker-entrypoint.sh eswrapper
      "


  keycloak:
    image: quay.io/keycloak/keycloak:23.0.0
    container_name: payshield_keycloak
    ports:
      - "8444:8443"
    environment:
      - KC_PROXY=edge
      - KC_HOSTNAME_STRICT=false
      - KC_HTTPS_CLIENT_AUTH=request
      - KC_HTTPS_TRUST_STORE_FILE=/opt/keycloak/conf/truststore.jks
      - KC_HTTPS_TRUST_STORE_PASSWORD=password
      - KC_TRUSTSTORE_PATHS=/opt/keycloak/conf/truststore.jks
      - KC_TRUSTSTORE_PASSWORD=password
      - KEYCLOAK_ADMIN=${KC_ADMIN_USER}
      - KEYCLOAK_ADMIN_PASSWORD=${KC_ADMIN_PASSWORD}
      - KC_DB_PASSWORD=${DB_PASSWORD}
      - KC_HTTPS_CERTIFICATE_FILE=/opt/keycloak/conf/server.crt
      - KC_HTTPS_CERTIFICATE_KEY_FILE=/opt/keycloak/conf/server.key
    volumes:
      - ./cert/truststore.jks:/opt/keycloak/conf/truststore.jks:ro
      - ./cert/keycloak.crt:/opt/keycloak/conf/server.crt:ro
      - ./key/keycloak.key:/opt/keycloak/conf/server.key:ro
    command: start-dev


  opa:
    image: openpolicyagent/opa:latest-static
    container_name: payshield_opa
    ports:
      - "8181:8181"
    volumes:
      - ../pdp/policy.rego:/fortress/policy.rego:ro
      - ./cert/opa.crt:/cert/opa.crt:ro
      - ./key/opa.key:/cert/opa.key:ro
      - ./cert/ca.crt:/cert/ca.crt:ro
    command:
      - run
      - --server
      - --addr=:8181
      - --tls-cert-file=/cert/opa.crt
      - --tls-private-key-file=/cert/opa.key
      - --tls-ca-cert-file=/cert/ca.crt
      - --watch
      - /fortress/policy.rego


  app:
    build: .
    container_name: payshield_app
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE}"
      DB_USERNAME: root
      DB_PASSWORD: admin
      VAULT_TOKEN: "${VAULT_APP_TOKEN}"
    volumes:
      - .:/var/www/html
      - ./cert/db_client.crt:/var/www/html/cert/db_client.crt:ro
      - ./key/db_client.key:/var/www/html/key/db_client.key:ro
      - ./cert/ca.crt:/var/www/html/cert/ca.crt:ro
    command: >
      sh -c "php artisan config:clear && apache2-foreground"


  webserver:
    image: nginx:latest
    container_name: payshield_webserver
    ports:
      - "8443:8443"
    volumes:
      - ../webserver/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./cert/server.crt:/etc/nginx/certs/server.crt:ro
      - ./key/server.key:/etc/nginx/certs/server.key:ro
      - ./cert/ca.crt:/etc/nginx/certs/ca.crt:ro


  kong:
    image: kong:3.4-ubuntu
    container_name: payshield_kong
    user: root
    environment:
      KONG_DATABASE: off
      KONG_DECLARATIVE_CONFIG: /tmp/kong_run.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8000, 0.0.0.0:8443 ssl"

      KONG_SSL_CERT: /tmp/certs/kong.crt
      KONG_SSL_CERT_KEY: /tmp/certs/kong.key

      KONG_NGINX_PROXY_SSL_VERIFY_CLIENT: on
      KONG_NGINX_PROXY_SSL_CLIENT_CERTIFICATE: /tmp/certs/ca.crt

      KONG_CLIENT_SSL: on
      KONG_CLIENT_SSL_CERT: /tmp/certs/kong.crt
      KONG_CLIENT_SSL_CERT_KEY: /tmp/certs/kong.key

      KONG_LUA_SSL_TRUSTED_CERTIFICATE: /tmp/certs/ca.crt

      VAULT_TOKEN: "${VAULT_APP_TOKEN}"
      KONG_PLUGINS: bundled,opa

    volumes:
      - ../gateway/kong.yml:/usr/local/kong/declarative/kong.yml:ro
      - ../pdp:/usr/local/share/lua/5.1/kong/plugins/opa:ro

    command: >
      sh -c "
      which jq >/dev/null || (apt-get update && apt-get install -y curl jq gawk);

      mkdir -p /tmp/certs;
      echo 'Fetching certs from Vault...';

      curl -s -k -H \"X-Vault-Token: $$VAULT_TOKEN\"
      https://payshield_vault:8200/v1/secret/data/mtls > /tmp/mtls.json;

      jq -r '.data.data.kong_cert' /tmp/mtls.json | awk '{gsub(/\\\\n/,\"\n\")}1' > /tmp/certs/kong.crt;
      jq -r '.data.data.kong_key'  /tmp/mtls.json | awk '{gsub(/\\\\n/,\"\n\")}1' > /tmp/certs/kong.key;
      jq -r '.data.data.ca_cert'   /tmp/mtls.json | awk '{gsub(/\\\\n/,\"\n\")}1' > /tmp/certs/ca.crt;

      sed 's/^/      /' /tmp/certs/kong.crt > /tmp/certs/kong_indented.crt;
      sed 's/^/      /' /tmp/certs/kong.key > /tmp/certs/kong_indented.key;

      CLIENT_SECRET=$$(curl -s -k -H \"X-Vault-Token: $$VAULT_TOKEN\"
      https://payshield_vault:8200/v1/secret/data/payshield
      | jq -r '.data.data.CLIENT_SECRET');

      cp /usr/local/kong/declarative/kong.yml /tmp/kong_run.yml;

      sed -i \"s|__CLIENT_SECRET__|$$CLIENT_SECRET|g\" /tmp/kong_run.yml;
      sed -i \"/__KONG_CERT_CONTENT__/r /tmp/certs/kong_indented.crt\" /tmp/kong_run.yml;
      sed -i \"/__KONG_CERT_CONTENT__/d\" /tmp/kong_run.yml;
      sed -i \"/__KONG_KEY_CONTENT__/r /tmp/certs/kong_indented.key\" /tmp/kong_run.yml;
      sed -i \"/__KONG_KEY_CONTENT__/d\" /tmp/kong_run.yml;

      echo 'Kong Gateway is starting with mTLS...';

      /docker-entrypoint.sh kong docker-start
      "


  waf:
    image: owasp/modsecurity-crs:nginx
    container_name: payshield_waf
    ports:
      - "8888:8443"
    environment:
      MODSEC_RULE_ENGINE: "On"
      BACKEND: "https://payshield_kong:8443"
      PARANOIA: 3
      ANOMALY_INBOUND: 3
      ANOMALY_OUTBOUND: 3
      ALLOWED_METHODS: "GET HEAD POST PUT DELETE OPTIONS"
      SSL_PORT: 8443
    volumes:
      - ../gateway/waf.conf:/etc/nginx/templates/conf.d/default.conf.template:ro
      - ./cert/waf.crt:/etc/nginx/certs/waf.crt:ro
      - ./key/waf.key:/etc/nginx/certs/waf.key:ro
      - ./cert/ca.crt:/etc/nginx/certs/ca.crt:ro


  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.0
    container_name: payshield_kibana
    environment:
      - ELASTICSEARCH_HOSTS=https://elasticsearch:9200
      - VAULT_TOKEN=${VAULT_APP_TOKEN}
      - SERVER_SSL_CERTIFICATE=/usr/share/kibana/config/certs/elk.crt
      - SERVER_SSL_KEY=/usr/share/kibana/config/keys/elk.key
    volumes:
      - ./cert/elk.crt:/usr/share/kibana/config/certs/elk.crt:ro
      - ./key/elk.key:/usr/share/kibana/config/keys/elk.key:ro
    command: >
      sh -c "
      export ELASTICSEARCH_PASSWORD=$$(curl -s -k -H \"X-Vault-Token: $$VAULT_TOKEN\"
      https://payshield_vault:8200/v1/secret/data/payshield
      | jq -r '.data.data.ELK_PASSWORD');

      /usr/local/bin/kibana-docker --allow-root
      "


  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.0
    container_name: payshield_logstash
    environment:
      - VAULT_TOKEN=${VAULT_APP_TOKEN}
    volumes:
      - ../siem/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
      - ./cert/ca.crt:/usr/share/logstash/config/certs/ca.crt:ro
      - ./cert/elk.crt:/usr/share/logstash/config/certs/elk.crt:ro
      - ./key/elk.key:/usr/share/logstash/config/certs/elk.key:ro
    command: >
      sh -c "
      export ELK_PASSWORD=$$(curl -s -k -H \"X-Vault-Token: $$VAULT_TOKEN\"
      https://payshield_vault:8200/v1/secret/data/payshield
      | jq -r '.data.data.ELK_PASSWORD');

      /usr/local/bin/docker-entrypoint
      "


  filebeat:
    image: docker.elastic.co/beats/filebeat:8.13.0
    container_name: payshield_filebeat
    volumes:
      - ../siem/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./cert/ca.crt:/etc/certs/ca.crt:ro
      - ./cert/db_client.crt:/etc/certs/db_client.crt:ro
      - ./key/db_client.key:/etc/keys/db_client.key:ro
    command: filebeat -e -strict.perms=false


volumes:
  payshield_mysql_data:
  payshield_vault_data:
  payshield_siem_data: