services:
  app:
    build: .
    container_name: payshield_app
    ports:
      - "8081:80"
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_started
      vault:
        condition: service_started
    command: sh -c "sleep 5 && php artisan config:clear && apache2-foreground"

  db:
    image: mysql:8.0
    container_name: payshield_db
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: QlyLuong
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}      
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - payshield_mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  keycloak:
    image: quay.io/keycloak/keycloak:23.0.0
    container_name: payshield_keycloak
    ports:
      - "8444:8443"
    environment:
      KEYCLOAK_ADMIN: ${KC_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8444
      KC_HOSTNAME_STRICT_HTTPS: "true"
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://db:3306/QlyKeyCloak
      KC_DB_USERNAME: root
      KC_DB_PASSWORD: ${DB_PASSWORD}
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/conf/server.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/conf/server.key
    depends_on:
      - db
    volumes:
      - ./cert/keycloak.crt:/opt/keycloak/conf/server.crt
      - ./key/keycloak.key:/opt/keycloak/conf/server.key
    command: start-dev

  kong:
    image: kong:3.4-ubuntu
    container_name: payshield_kong
    user: "root"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: "/tmp/kong_run.yml" 
      KONG_CLIENT_SSL: "on"
      KONG_CLIENT_SSL_CERT: "/etc/kong/certs/kong.crt"
      KONG_CLIENT_SSL_CERT_KEY: "/etc/kong/certs/kong.key"
      KONG_PROXY_LISTEN: "0.0.0.0:8000, 0.0.0.0:8443 ssl"
      KONG_NGINX_PROXY_SSL_VERIFY_CLIENT: "on"
      KONG_NGINX_PROXY_SSL_CLIENT_CERTIFICATE: "/etc/kong/certs/ca.crt"
      VAULT_TOKEN: "${VAULT_APP_TOKEN}"
      KONG_PLUGINS: "bundled,opa"
      KONG_DNS_RESOLVER: "127.0.0.11"
    ports:
      - "8000:8000"
    volumes:
      - ../gateway/kong.yml:/usr/local/kong/declarative/kong.yml
      - ./opa:/usr/local/share/lua/5.1/kong/plugins/opa
    depends_on:
      vault:
        condition: service_started
    command: >
      sh -c "apt-get update && apt-get install -y curl jq gawk &&
             mkdir -p /etc/kong/certs &&
             echo '>>> [1/3] STEP 1: CONNECTING TO HASHICORP VAULT...' &&
             curl -s -k -w '\nHTTP_CODE:%{http_code}' -H \"X-Vault-Token: $$VAULT_TOKEN\" https://payshield_vault:8200/v1/secret/data/mtls > /tmp/mtls_raw.txt &&
             HTTP_STATUS=$$(grep HTTP_CODE /tmp/mtls_raw.txt | cut -d':' -f2) &&
             sed '/HTTP_CODE/d' /tmp/mtls_raw.txt > /tmp/mtls.json &&
             if [ \"$$HTTP_STATUS\" != \"200\" ]; then
               echo '>>> [FATAL ERROR] VAULT ACCESS DENIED (HTTP '$$HTTP_STATUS')!';
               echo '>>> CAUSE: VAULT_APP_TOKEN IS MISSING OR EXPIRED.';
               cat /tmp/mtls.json;
               sleep 60;
               exit 1;
             fi &&
             echo '>>> [2/3] STEP 2: PROCESSING AND FORMATTING CERTIFICATES...' &&
             jq -r '.data.data.kong_cert' /tmp/mtls.json | awk '{gsub(/\\\\n/,\"\n\")}1' > /etc/kong/certs/kong.crt &&
             jq -r '.data.data.kong_key' /tmp/mtls.json | awk '{gsub(/\\\\n/,\"\n\")}1' > /etc/kong/certs/kong.key &&
             jq -r '.data.data.ca_cert' /tmp/mtls.json | awk '{gsub(/\\\\n/,\"\n\")}1' > /etc/kong/certs/ca.crt &&
             curl -s -k -H \"X-Vault-Token: $$VAULT_TOKEN\" https://payshield_vault:8200/v1/secret/data/payshield > /tmp/jwt.json &&
             CLIENT_SECRET=$$(jq -r '.data.data.CLIENT_SECRET' /tmp/jwt.json) &&
             echo '>>> [3/3] STEP 3: INJECTING SECRETS INTO KONG CONFIGURATION...' &&
             cp /usr/local/kong/declarative/kong.yml /tmp/kong_run.yml &&
             sed -i \"s|__CLIENT_SECRET__|$$CLIENT_SECRET|g\" /tmp/kong_run.yml &&
             echo '>>> KONG GATEWAY IS READY FOR DEPLOYMENT!' &&
             /docker-entrypoint.sh kong docker-start"
  
  waf:
    image: owasp/modsecurity-crs:nginx
    container_name: payshield_waf
    user: "root"
    ports:
      - "8888:8443" 
    environment:
      MODSEC_RULE_ENGINE: "On"
      BACKEND: "https://payshield_kong:8443" 
      PARANOIA: 3                   
      ANOMALY_INBOUND: 3   
      ANOMALY_OUTBOUND: 3
      ALLOWED_METHODS: "GET HEAD POST PUT DELETE OPTIONS"
      VAULT_TOKEN: "${VAULT_APP_TOKEN}"
      SSL_PORT: 8443
    volumes:
      - ../gateway/waf.conf:/etc/nginx/conf.d/waf.conf
    depends_on:
      - kong
      - vault
    command: >
      sh -c "if command -v apk >/dev/null 2>&1; then apk add --no-cache curl jq gawk; else apt-get update && apt-get install -y curl jq gawk; fi &&
             mkdir -p /etc/nginx/certs &&
             mkdir -p /etc/nginx/ssl &&
             echo '>>> [WAF] Fetching certificates from Vault...' &&
             curl -s -k -w '\nHTTP_CODE:%{http_code}' -H \"X-Vault-Token: $$VAULT_TOKEN\" https://payshield_vault:8200/v1/secret/data/mtls > /tmp/mtls_raw.txt &&
             HTTP_STATUS=$$(grep HTTP_CODE /tmp/mtls_raw.txt | cut -d':' -f2) &&
             sed '/HTTP_CODE/d' /tmp/mtls_raw.txt > /tmp/mtls.json &&
             if [ \"$$HTTP_STATUS\" != \"200\" ]; then
               echo '>>> [FATAL ERROR] WAF KHONG THE LAY CERT TU VAULT!';
               sleep 60;
               exit 1;
             fi &&
             jq -r '.data.data.waf_cert' /tmp/mtls.json | awk '{gsub(/\\\\n/,\"\n\")}1' > /etc/nginx/certs/waf.crt &&
             jq -r '.data.data.waf_key' /tmp/mtls.json | awk '{gsub(/\\\\n/,\"\n\")}1' > /etc/nginx/certs/waf.key &&
             jq -r '.data.data.ca_cert' /tmp/mtls.json | awk '{gsub(/\\\\n/,\"\n\")}1' > /etc/nginx/certs/ca.crt &&
             cp /etc/nginx/certs/waf.crt /etc/nginx/ssl/server.crt &&
             cp /etc/nginx/certs/waf.key /etc/nginx/ssl/server.key &&
             echo '>>> [WAF] Da nap mTLS Cert thanh cong! Starting ModSecurity...' &&
             /docker-entrypoint.sh nginx -g 'daemon off;'"

  vault:
    image: hashicorp/vault:1.13.3
    container_name: payshield_vault
    ports:
      - "8200:8200"
    environment:
      VAULT_LOCAL_CONFIG: '{"storage": {"file": {"path": "/vault/file"}}, "listener": {"tcp": {"address": "0.0.0.0:8200", "tls_disable": "0", "tls_cert_file": "/vault/certs/vault.crt", "tls_key_file": "/vault/certs/vault.key"}}, "ui": true, "disable_mlock": true}'
      VAULT_ADDR: "https://0.0.0.0:8200"
      VAULT_API_ADDR: "https://0.0.0.0:8200"
    cap_add:
      - IPC_LOCK
    command: server
    volumes:
      - payshield_vault_data:/vault/file
      - ./cert/ca.crt:/vault/certs/ca.crt
      - ./cert/vault.crt:/vault/certs/vault.crt
      - ./key/vault.key:/vault/certs/vault.key

  swagger:
    image: swaggerapi/swagger-ui
    container_name: payshield_swagger
    ports:
      - "6868:8080"
    environment:
      SWAGGER_JSON: /docs/OpenAPI.yml
      OAUTH_USE_PKCE: "true" 
    volumes:
      - ../docs:/docs

  nginx:
    image: nginx:latest
    container_name: payshield_nginx
    user: "root"
    ports:
      - "8443:8443"
    environment:
      VAULT_TOKEN: "${VAULT_APP_TOKEN}" 
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      app:
        condition: service_started
      vault:
        condition: service_started
    command: >
      sh -c "apt-get update && apt-get install -y curl jq &&
             mkdir -p /etc/nginx/certs &&
             curl -s -k -H \"X-Vault-Token: $$VAULT_TOKEN\" https://payshield_vault:8200/v1/secret/data/mtls > /tmp/mtls.json &&
             jq -r '.data.data.laravel_cert' /tmp/mtls.json > /etc/nginx/certs/laravel.crt &&
             jq -r '.data.data.laravel_key' /tmp/mtls.json > /etc/nginx/certs/laravel.key &&
             jq -r '.data.data.ca_cert' /tmp/mtls.json > /etc/nginx/certs/ca.crt &&
             nginx -g 'daemon off;'"

  opa:
    image: openpolicyagent/opa:latest
    container_name: payshield_opa
    volumes:
      - ./opa/policy.rego:/fortress/policy.rego 
    command: "run --server --addr :8181 --watch /fortress/policy.rego"
volumes:
  payshield_mysql_data:
  payshield_vault_data: