services:
  app:
    build: .
    container_name: payshield_app
    ports:
      - "8081:80"
    volumes:
      - .:/var/www/html
      - payshield_certs_shared:/var/www/html/cert 
      - payshield_keys_shared:/var/www/html/key
    depends_on:
      db:
        condition: service_started
      vault:
        condition: service_started
    environment:
      VAULT_TOKEN: "${VAULT_APP_TOKEN}"
    command: >
      sh -c "apt-get update && apt-get install -y curl jq gawk openssl &&
             echo '>>> Fetching VNPay & DB Certs from Vault...' &&
             curl -s -k -H \"X-Vault-Token: $$VAULT_TOKEN\" https://payshield_vault:8200/v1/secret/data/payshield > /tmp/secrets.json &&
             curl -s -k -H \"X-Vault-Token: $$VAULT_TOKEN\" https://payshield_vault:8200/v1/secret/data/mtls > /tmp/mtls.json &&
             mkdir -p /var/www/html/cert &&
             mkdir -p /var/www/html/key &&
             TEST_CERT=$$(jq -r '.data.data.laravel_cert' /tmp/mtls.json) &&
             if [ \"$$TEST_CERT\" != \"null\" ] && [ -n \"$$TEST_CERT\" ]; then
               echo '>>> [OK] Vault xịn! Ghi file cert cho App...' &&
               jq -r '.data.data.laravel_cert' /tmp/mtls.json | awk '{gsub(/\\\\n/,\"\n\")}1' > /var/www/html/cert/db_client.crt &&
               jq -r '.data.data.ca_cert' /tmp/mtls.json | awk '{gsub(/\\\\n/,\"\n\")}1' > /var/www/html/cert/ca.crt &&
               jq -r '.data.data.laravel_key' /tmp/mtls.json | awk '{gsub(/\\\\n/,\"\n\")}1' > /tmp/db_client_tmp.key &&
               openssl rsa -in /tmp/db_client_tmp.key -out /var/www/html/key/db_client.key &&
               chmod -R 755 /var/www/html/cert /var/www/html/key && 
               rm /tmp/db_client_tmp.key;
             else
               echo '>>> [Lỗi] App khong lay duoc cert!' && cat /tmp/mtls.json;
             fi &&
             php artisan config:clear && 
             apache2-foreground"

  db:
    image: mysql:8.0
    container_name: payshield_db
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: QlyLuong
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    command: 
      - --ssl-ca=/etc/mysql/certs/ca.crt
      - --ssl-cert=/etc/mysql/certs/server.crt
      - --ssl-key=/etc/mysql/certs/server.key
      - --require_secure_transport=ON
    volumes:
      - ./cert/ca.crt:/etc/mysql/certs/ca.crt:ro
      - ./cert/db_server.crt:/etc/mysql/certs/server.crt:ro
      - ./key/db_server.key:/etc/mysql/certs/server.key:ro
      - payshield_mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  keycloak:
    image: quay.io/keycloak/keycloak:23.0.0
    container_name: payshield_keycloak
    ports:
      - "8444:8443"
    environment:
      KEYCLOAK_ADMIN: ${KC_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8444
      KC_HOSTNAME_STRICT_HTTPS: "true"
      KC_DB: mysql
      KC_DB_URL: "jdbc:mysql://db:3306/QlyKeyCloak?useSSL=true&verifyServerCertificate=true&trustCertificateKeyStoreUrl=file:/opt/keycloak/conf/truststore.jks&trustCertificateKeyStorePassword=password"
      KC_DB_USERNAME: root
      KC_DB_PASSWORD: ${DB_PASSWORD}
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/conf/server.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/conf/server.key
    depends_on:
      - db
    volumes:
      - ./cert/truststore.jks:/opt/keycloak/conf/truststore.jks
      - ./cert/keycloak.crt:/opt/keycloak/conf/server.crt
      - ./key/keycloak.key:/opt/keycloak/conf/server.key
    command: start-dev

  kong:
    image: kong:3.4-ubuntu
    container_name: payshield_kong
    user: "root"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: "/tmp/kong_run.yml"
      KONG_CLIENT_SSL: "on"
      KONG_CLIENT_SSL_CERT: "/etc/kong/certs/kong.crt"
      KONG_CLIENT_SSL_CERT_KEY: "/etc/kong/certs/kong.key"
      KONG_PROXY_LISTEN: "0.0.0.0:8000, 0.0.0.0:8443 ssl"
      KONG_LUA_SSL_TRUSTED_CERTIFICATE: "/etc/kong/certs/ca.crt"
      KONG_NGINX_PROXY_SSL_VERIFY_CLIENT: "on"
      KONG_NGINX_PROXY_SSL_CLIENT_CERTIFICATE: "/etc/kong/certs/ca.crt"
      VAULT_TOKEN: "${VAULT_APP_TOKEN}"
      KONG_PLUGINS: "bundled,opa"
      KONG_DNS_RESOLVER: "127.0.0.11"
    ports:
      - "8000:8000"
    volumes:
      - ../gateway/kong.yml:/usr/local/kong/declarative/kong.yml
      - ../opa:/usr/local/share/lua/5.1/kong/plugins/opa
    depends_on:
      vault:
        condition: service_started
    command: >
      sh -c "apt-get update && apt-get install -y curl jq gawk &&
             mkdir -p /etc/kong/certs &&
             echo '>>> [1/3] STEP 1: CONNECTING TO HASHICORP VAULT...' &&
             curl -s -k -w '\nHTTP_CODE:%{http_code}' -H \"X-Vault-Token: $$VAULT_TOKEN\" https://payshield_vault:8200/v1/secret/data/mtls > /tmp/mtls_raw.txt &&
             HTTP_STATUS=$$(grep HTTP_CODE /tmp/mtls_raw.txt | cut -d':' -f2) &&
             sed '/HTTP_CODE/d' /tmp/mtls_raw.txt > /tmp/mtls.json &&
             if [ \"$$HTTP_STATUS\" != \"200\" ]; then
               echo '>>> [FATAL ERROR] VAULT ACCESS DENIED (HTTP '$$HTTP_STATUS')!';
               sleep 60;
               exit 1;
             fi &&
             echo '>>> [2/3] STEP 2: PROCESSING AND FORMATTING CERTIFICATES...' &&
             jq -r '.data.data.kong_cert' /tmp/mtls.json | awk '{gsub(/\\\\n/,\"\n\")}1' > /etc/kong/certs/kong.crt &&
             jq -r '.data.data.kong_key' /tmp/mtls.json | awk '{gsub(/\\\\n/,\"\n\")}1' > /etc/kong/certs/kong.key &&
             jq -r '.data.data.ca_cert' /tmp/mtls.json | awk '{gsub(/\\\\n/,\"\n\")}1' > /etc/kong/certs/ca.crt &&
             curl -s -k -H \"X-Vault-Token: $$VAULT_TOKEN\" https://payshield_vault:8200/v1/secret/data/payshield > /tmp/jwt.json &&
             CLIENT_SECRET=$$(jq -r '.data.data.CLIENT_SECRET' /tmp/jwt.json) &&
             echo '>>> [3/3] STEP 3: INJECTING SECRETS INTO KONG CONFIGURATION...' &&
             cp /usr/local/kong/declarative/kong.yml /tmp/kong_run.yml &&
             sed -i \"s|__CLIENT_SECRET__|$$CLIENT_SECRET|g\" /tmp/kong_run.yml &&
             echo '>>> KONG GATEWAY IS READY FOR DEPLOYMENT!' &&
             /docker-entrypoint.sh kong docker-start"

  waf:
    image: owasp/modsecurity-crs:nginx
    container_name: payshield_waf
    user: "root"
    ports:
      - "8888:8443"
    environment:
      MODSEC_RULE_ENGINE: "On"
      BACKEND: "https://payshield_kong:8443"
      PARANOIA: 3
      ANOMALY_INBOUND: 3
      ANOMALY_OUTBOUND: 3
      ALLOWED_METHODS: "GET HEAD POST PUT DELETE OPTIONS"
      VAULT_TOKEN: "${VAULT_APP_TOKEN}"
      SSL_PORT: 8443
    volumes:
      - ../gateway/waf.conf:/etc/nginx/conf.d/waf.conf
    depends_on:
      - kong
      - vault
    command: >
      sh -c "if command -v apk >/dev/null 2>&1; then apk add --no-cache curl jq gawk; else apt-get update && apt-get install -y curl jq gawk; fi &&
             mkdir -p /etc/nginx/certs &&
             mkdir -p /etc/nginx/ssl &&
             echo '>>> [WAF] Fetching certificates from Vault...' &&
             curl -s -k -w '\nHTTP_CODE:%{http_code}' -H \"X-Vault-Token: $$VAULT_TOKEN\" https://payshield_vault:8200/v1/secret/data/mtls > /tmp/mtls_raw.txt &&
             HTTP_STATUS=$$(grep HTTP_CODE /tmp/mtls_raw.txt | cut -d':' -f2) &&
             sed '/HTTP_CODE/d' /tmp/mtls_raw.txt > /tmp/mtls.json &&
             if [ \"$$HTTP_STATUS\" != \"200\" ]; then
               echo '>>> [FATAL ERROR] WAF KHONG THE LAY CERT TU VAULT!';
               sleep 60;
               exit 1;
             fi &&
             jq -r '.data.data.waf_cert' /tmp/mtls.json | awk '{gsub(/\\\\n/,\"\n\")}1' > /etc/nginx/certs/waf.crt &&
             jq -r '.data.data.waf_key' /tmp/mtls.json | awk '{gsub(/\\\\n/,\"\n\")}1' > /etc/nginx/certs/waf.key &&
             jq -r '.data.data.ca_cert' /tmp/mtls.json | awk '{gsub(/\\\\n/,\"\n\")}1' > /etc/nginx/certs/ca.crt &&
             cp /etc/nginx/certs/waf.crt /etc/nginx/ssl/server.crt &&
             cp /etc/nginx/certs/waf.key /etc/nginx/ssl/server.key &&
             echo '>>> [WAF] Da nap mTLS Cert thanh cong! Starting ModSecurity...' &&
             /docker-entrypoint.sh nginx -g 'daemon off;'"

  vault:
    image: hashicorp/vault:1.13.3
    container_name: payshield_vault
    ports:
      - "8200:8200"
    environment:
      VAULT_LOCAL_CONFIG: '{"storage": {"file": {"path": "/vault/file"}}, "listener": {"tcp": {"address": "0.0.0.0:8200", "tls_disable": "0", "tls_cert_file": "/vault/certs/vault.crt", "tls_key_file": "/vault/certs/vault.key"}}, "ui": true, "disable_mlock": true}'
      VAULT_ADDR: "https://0.0.0.0:8200"
      VAULT_API_ADDR: "https://0.0.0.0:8200"
    cap_add:
      - IPC_LOCK
    command: server
    volumes:
      - payshield_vault_data:/vault/file
      - ./cert/ca.crt:/vault/certs/ca.crt
      - ./cert/vault.crt:/vault/certs/vault.crt
      - ./key/vault.key:/vault/certs/vault.key

  swagger:
    image: swaggerapi/swagger-ui
    container_name: payshield_swagger
    ports:
      - "6868:8080"
    environment:
      SWAGGER_JSON: /docs/OpenAPI.yml
      OAUTH_USE_PKCE: "true"
    volumes:
      - ../docs:/docs

  nginx:
    image: nginx:latest
    container_name: payshield_nginx
    user: "root"
    ports:
      - "8443:8443"
    environment:
      VAULT_TOKEN: "${VAULT_APP_TOKEN}"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./cert/ca.crt:/etc/nginx/certs/ca.crt:ro
    depends_on:
      app:
        condition: service_started
      vault:
        condition: service_started
    command: >
      sh -c "apt-get update && apt-get install -y curl jq gawk &&
             mkdir -p /etc/nginx/certs &&
             curl -s -k -H \"X-Vault-Token: $$VAULT_TOKEN\" https://payshield_vault:8200/v1/secret/data/mtls > /tmp/mtls.json &&
             TEST_CERT=$$(jq -r '.data.data.laravel_cert' /tmp/mtls.json) &&
             if [ \"$$TEST_CERT\" != \"null\" ] && [ -n \"$$TEST_CERT\" ]; then
                echo '>>> [OK] Vault xịn! Dang ghi file cert...' &&
                jq -r '.data.data.laravel_cert' /tmp/mtls.json | awk '{gsub(/\\\\n/,\"\n\")}1' | sed '/^$/d' > /etc/nginx/certs/laravel.crt &&
                jq -r '.data.data.laravel_key' /tmp/mtls.json | awk '{gsub(/\\\\n/,\"\n\")}1' | sed '/^$/d' > /etc/nginx/certs/laravel.key;
             else
                echo '>>> [LỖI] Khong tim thay laravel_cert trong Vault!' &&
                cat /tmp/mtls.json;
             fi &&
             nginx -g 'daemon off;'"

  opa:
    image: openpolicyagent/opa:latest
    container_name: payshield_opa
    volumes:
      - ../opa/policy.rego:/fortress/policy.rego
      - ./cert:/cert
      - ./key:/key
    command: >
      run --server
      --addr :8181
      --tls-cert-file /cert/opa.crt
      --tls-private-key-file /key/opa.key
      --watch /fortress/policy.rego

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: payshield_elasticsearch
    user: root
    environment:
      - node.name=elasticsearch
      - discovery.type=single-node
      - xpack.security.enabled=true
      - VAULT_TOKEN=${VAULT_APP_TOKEN} 
      - "ES_JAVA_OPTS=-Xms1024m -Xmx1024m"
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.key=certs/db_server.key
      - xpack.security.http.ssl.certificate=certs/db_server.crt
      - xpack.security.http.ssl.certificate_authorities=certs/ca.crt
    ports: ["9200:9200"]
    volumes: 
      - payshield_siem_data:/usr/share/elasticsearch/data
      - ./cert/ca.crt:/usr/share/elasticsearch/config/certs/ca.crt:ro
      - ./cert/db_server.crt:/usr/share/elasticsearch/config/certs/db_server.crt:ro
      - ./key/db_server.key:/usr/share/elasticsearch/config/certs/db_server.key:ro
    command: >
      sh -c "apt-get update && apt-get install -y curl jq gosu && # THÊM gosu VÀO ĐÂY
             echo '>>> [ES] Dang lay mat khau tu Vault...' &&
             PASS=$$(curl -s -k -H \"X-Vault-Token: $$VAULT_TOKEN\" https://payshield_vault:8200/v1/secret/data/payshield | jq -r '.data.data.ELK_PASSWORD') &&
             export ELASTIC_PASSWORD=$$PASS &&
             # GIỜ THÌ gosu ĐÃ CÓ SẴN ĐỂ CHẠY RỒI
             exec gosu elasticsearch /usr/local/bin/docker-entrypoint.sh eswrapper"

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.0
    container_name: payshield_kibana
    user: root
    ports: ["5601:5601"]
    environment:
      - ELASTICSEARCH_HOSTS=https://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - VAULT_TOKEN=${VAULT_APP_TOKEN}
      - ELASTICSEARCH_SSL_VERIFICATIONMODE=none
      - SERVER_SSL_ENABLED=true
      - SERVER_SSL_CERTIFICATE=/usr/share/kibana/config/certs/db_client.crt
      - SERVER_SSL_KEY=/usr/share/kibana/config/keys/db_client.key
    volumes:
      - payshield_certs_shared:/usr/share/kibana/config/certs:ro
      - payshield_keys_shared:/usr/share/kibana/config/keys:ro
    depends_on:
      elasticsearch:
        condition: service_started
    command: >
      sh -c "apt-get update && apt-get install -y curl jq &&
             echo '>>> [Kibana] Dang lay mat khau tu Vault...' &&
             PASS=$$(curl -s -k -H \"X-Vault-Token: $$VAULT_TOKEN\" https://payshield_vault:8200/v1/secret/data/payshield | jq -r '.data.data.ELK_PASSWORD') &&
             export ELASTICSEARCH_PASSWORD=$$PASS &&
             /usr/local/bin/kibana-docker --allow-root"

  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.0
    container_name: payshield_logstash
    user: root
    environment:
      - VAULT_TOKEN=${VAULT_APP_TOKEN} # Sếp đang thiếu dòng này trong file gửi tui
    volumes:
      - ../siem/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
      - payshield_certs_shared:/usr/share/logstash/config/certs:ro 
      - payshield_keys_shared:/usr/share/logstash/config/keys:ro
    depends_on:
      elasticsearch:
        condition: service_started
    command: >
      sh -c "apt-get update && apt-get install -y curl jq &&
             echo '>>> [Logstash] Dang lay mat khau tu Vault...' &&
             PASS=$$(curl -s -k -H \"X-Vault-Token: $$VAULT_TOKEN\" https://payshield_vault:8200/v1/secret/data/payshield | jq -r '.data.data.ELK_PASSWORD') &&
             export ELK_PASSWORD=$$PASS &&
             /usr/local/bin/docker-entrypoint"

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.13.0
    container_name: payshield_filebeat
    user: root
    command: filebeat -e -strict.perms=false
    volumes:
      - ../siem/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - payshield_certs_shared:/etc/certs:ro
      - payshield_keys_shared:/etc/keys:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: ["logstash"]

volumes:
  payshield_mysql_data:
  payshield_vault_data:
  payshield_siem_data:
  payshield_certs_shared:
  payshield_keys_shared: