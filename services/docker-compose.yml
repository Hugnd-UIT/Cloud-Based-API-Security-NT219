services:

  vault:
    image: hashicorp/vault:1.13.3
    container_name: payshield_vault

    ports:
      - "8200:8200"

    environment:
      VAULT_LOCAL_CONFIG: '{"storage": {"file": {"path": "/vault/file"}}, "listener": {"tcp": {"address": "0.0.0.0:8200", "tls_disable": "0", "tls_cert_file": "/vault/certs/vault.crt", "tls_key_file": "/vault/certs/vault.key", "tls_require_and_verify_client_cert": true, "tls_client_ca_file": "/vault/certs/ca.crt", "tls_cipher_suites": "TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256"}}, "ui": true, "disable_mlock": true}'

    cap_add:
      - IPC_LOCK

    command: server

    volumes:
      - payshield_vault_data:/vault/file
      - ../kms:/vault/certs:ro


  vault-agent-controller:
    image: hashicorp/vault:1.13.3
    container_name: payshield_vault_agent

    environment:
      - VAULT_ROLE_ID=${VAULT_ROLE_ID}
      - VAULT_SECRET_ID=${VAULT_SECRET_ID}
      - VAULT_ADDR=https://payshield_vault:8200
      - VAULT_SKIP_VERIFY=true

    command: >
      sh -c "echo $$VAULT_ROLE_ID > /tmp/roleid && 
             echo $$VAULT_SECRET_ID > /tmp/secretid && 
             vault agent -config=/kms/vault-agent/agent.hcl"

    volumes:
      - ../kms/vault-agent:/kms/vault-agent:ro
      - ../kms/ca.crt:/kms/ca.crt:ro
      - ../kms/vault.crt:/kms/vault.crt:ro
      - ../kms/vault.key:/kms/vault.key:ro
      - client_certs:/tmpfs/certs/client
      - kong_certs:/tmpfs/certs/kong
      - waf_certs:/tmpfs/certs/waf
      - keycloak_certs:/tmpfs/certs/keycloak
      - nginx_certs:/tmpfs/certs/nginx
      - app_certs:/tmpfs/certs/app
      - db_certs:/tmpfs/certs/db
      - siem_certs:/tmpfs/certs/siem

    healthcheck:
      test: ["CMD-SHELL", "test -f /tmpfs/certs/kong/server.crt && test -f /tmpfs/certs/waf/server.crt && test -f /tmpfs/certs/nginx/server.crt && test -f /tmpfs/certs/app/server.crt && test -f /tmpfs/certs/db/server.crt && test -f /tmpfs/certs/keycloak/server.crt && test -f /tmpfs/certs/siem/server.crt && test -f /tmpfs/certs/client/server.crt"]
      interval: 5s
      timeout: 5s
      retries: 60


  db:
    image: mysql:8.0
    container_name: payshield_db

    depends_on:
      vault-agent-controller:
        condition: service_healthy

    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}

    command:
      - --require_secure_transport=ON
      - --ssl-ca=/kms/ca.crt
      - --ssl-key=/tmpfs/certs/server.key
      - --ssl-cert=/tmpfs/certs/server.crt

    volumes:
      - db_certs:/tmpfs/certs:ro
      - ../kms/ca.crt:/kms/ca.crt:ro
      - ./scripts/database-init.sql:/docker-entrypoint-initdb.d/init.sql


  keycloak:
    image: quay.io/keycloak/keycloak:23.0.0
    container_name: payshield_keycloak

    ports:
      - "8444:8443"

    depends_on:
      vault-agent-controller:
        condition: service_healthy

    environment:
      - KC_HOSTNAME_STRICT=false
      - KEYCLOAK_ADMIN=${KC_ADMIN_USER}
      - KEYCLOAK_ADMIN_PASSWORD=${KC_ADMIN_PASSWORD}
      - KC_HTTPS_TRUST_STORE_TYPE=PKCS12
      - KC_HTTPS_TRUST_STORE_FILE=/kms/truststore.p12
      - KC_HTTPS_TRUST_STORE_PASSWORD=password
      - KC_HTTPS_CERTIFICATE_FILE=/tmpfs/certs/server.crt
      - KC_HTTPS_CERTIFICATE_KEY_FILE=/tmpfs/certs/server.key

    command: start-dev

    volumes:
      - keycloak_certs:/tmpfs/certs:ro
      - ../kms/truststore.p12:/kms/truststore.p12:ro


  app:
    build: .
    container_name: payshield_app

    depends_on:
      vault-agent-controller:
        condition: service_healthy

    environment:
      DB_CONNECTION: mysql
      DB_HOST: payshield_db
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE}"
      DB_USERNAME: root
      DB_PASSWORD: admin
      VAULT_TOKEN: "${VAULT_APP_TOKEN}"

    command: >
      sh -c "a2enmod ssl && php artisan config:clear && apache2-foreground"

    volumes:
      - .:/var/www/html
      - ../kms/ca.crt:/kms/ca.crt:ro
      - ../kms/client.crt:/kms/client.crt:ro
      - ../kms/client.key:/kms/client.key:ro
      - app_certs:/tmpfs/certs:ro
      - ./scripts/laravel-ext.conf:/etc/apache2/sites-available/000-default.conf:ro


  proxy:
    image: nginx:latest
    container_name: payshield_proxy

    ports:
      - "8443:8443"

    depends_on:
      vault-agent-controller:
        condition: service_healthy

    volumes:
      - ../proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../kms/ca.crt:/kms/ca.crt:ro
      - nginx_certs:/tmpfs/certs:ro


  kong:
    image: kong:3.4-ubuntu
    container_name: payshield_kong
    user: root

    depends_on:
      vault-agent-controller:
        condition: service_healthy

    environment:
      KONG_DATABASE: off
      KONG_DECLARATIVE_CONFIG: /tmp/kong_run.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8000, 0.0.0.0:8443 ssl"
      KONG_SSL_CERT: /tmpfs/certs/server.crt
      KONG_SSL_CERT_KEY: /tmpfs/certs/server.key
      KONG_NGINX_PROXY_SSL_VERIFY_CLIENT: on
      KONG_NGINX_PROXY_SSL_CLIENT_CERTIFICATE: /kms/ca.crt
      KONG_CLIENT_SSL: on
      KONG_CLIENT_SSL_CERT: /tmpfs/certs/server.crt
      KONG_CLIENT_SSL_CERT_KEY: /tmpfs/certs/server.key
      KONG_LUA_SSL_TRUSTED_CERTIFICATE: /kms/ca.crt
      VAULT_TOKEN: "${VAULT_APP_TOKEN}"
      KONG_PLUGINS: bundled

    command: >
      sh -c "
      which jq >/dev/null || (apt-get update && apt-get install -y curl jq gawk);
      CLIENT_SECRET=$$(curl -s --cacert /kms/ca.crt --cert /tmpfs/certs/server.crt --key /tmpfs/certs/server.key -H \"X-Vault-Token: $$VAULT_TOKEN\" https://payshield_vault:8200/v1/secret/data/payshield | jq -r '.data.data.CLIENT_SECRET');
      cp /usr/local/kong/declarative/kong.yml /tmp/kong_run.yml;
      sed -i \"s|__CLIENT_SECRET__|$$CLIENT_SECRET|g\" /tmp/kong_run.yml;
      /docker-entrypoint.sh kong docker-start"

    volumes:
      - ../gateway/kong.yml:/usr/local/kong/declarative/kong.yml:ro
      - ../kms/ca.crt:/kms/ca.crt:ro
      - kong_certs:/tmpfs/certs:ro


  waf:
    image: owasp/modsecurity-crs:nginx
    container_name: payshield_waf

    ports:
      - "8888:8443"

    depends_on:
      vault-agent-controller:
        condition: service_healthy

    environment:
      MODSEC_RULE_ENGINE: "On"
      BACKEND: "https://payshield_kong:8443"
      PARANOIA: 3
      ANOMALY_INBOUND: 3
      ANOMALY_OUTBOUND: 3
      ALLOWED_METHODS: "GET HEAD POST PUT DELETE OPTIONS"
      SSL_PORT: 8443

    volumes:
      - ../gateway/waf.conf:/etc/nginx/templates/conf.d/default.conf.template:ro
      - ../kms/ca.crt:/kms/ca.crt:ro
      - waf_certs:/tmpfs/certs:ro


  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: payshield_elasticsearch

    ports: 
      - "9200:9200"

    depends_on:
      vault-agent-controller:
        condition: service_healthy

    environment:
      - "discovery.type=single-node"
      - "xpack.security.enabled=true"
      - "xpack.security.http.ssl.enabled=true"
      - "xpack.security.http.ssl.key=/usr/share/elasticsearch/config/certs/server.key"
      - "xpack.security.http.ssl.certificate=/usr/share/elasticsearch/config/certs/server.crt"
      - "xpack.security.http.ssl.certificate_authorities=/usr/share/elasticsearch/config/ca.crt"
      - "xpack.security.http.ssl.client_authentication=optional"
      - "xpack.security.transport.ssl.enabled=true"
      - "xpack.security.transport.ssl.key=/usr/share/elasticsearch/config/certs/server.key"
      - "xpack.security.transport.ssl.certificate=/usr/share/elasticsearch/config/certs/server.crt"
      - "xpack.security.transport.ssl.certificate_authorities=/usr/share/elasticsearch/config/ca.crt"
      - ELASTIC_PASSWORD=${ELK_PASSWORD}

    volumes:
      - payshield_siem_data:/usr/share/elasticsearch/data
      - ../kms/ca.crt:/usr/share/elasticsearch/config/ca.crt:ro
      - siem_certs:/usr/share/elasticsearch/config/certs:ro


  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.0
    container_name: payshield_logstash

    depends_on:
      vault-agent-controller:
        condition: service_healthy

    environment:
      - ELK_PASSWORD=${ELK_PASSWORD}
      - xpack.monitoring.enabled=false

    volumes:
      - ../siem/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
      - ../kms/ca.crt:/etc/ssl/certs/ca.crt:ro
      - siem_certs:/tmpfs/certs:ro


  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.0
    container_name: payshield_kibana

    ports:
      - "5601:5601"

    depends_on:
      vault-agent-controller:
        condition: service_healthy

    environment:
      - ELASTICSEARCH_HOSTS=https://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system 
      - SERVER_SSL_ENABLED=true
      - SERVER_SSL_CERTIFICATE=/tmpfs/certs/server.crt
      - SERVER_SSL_KEY=/tmpfs/certs/server.key
      - ELASTICSEARCH_SSL_VERIFICATIONMODE=none
      - ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES=/kms/ca.crt
      - ELASTICSEARCH_SSL_CERTIFICATE=/tmpfs/certs/server.crt
      - ELASTICSEARCH_SSL_KEY=/tmpfs/certs/server.key
      - NODE_EXTRA_CA_CERTS=/kms/ca.crt
      - ELK_PASSWORD=${ELK_PASSWORD}
      - ELASTICSEARCH_PASSWORD=${ELK_PASSWORD}

    command: >
      sh -c "
      until curl -s -k -u \"elastic:$${ELK_PASSWORD}\" https://elasticsearch:9200 | grep -q \"cluster_uuid\"; do echo 'Waiting Elasticsearch...'; sleep 3; done;
      curl -s -k -u \"elastic:$${ELK_PASSWORD}\" -X POST \"https://elasticsearch:9200/_security/user/kibana_system/_password\" -H \"Content-Type: application/json\" -d \"{\\\"password\\\":\\\"$${ELK_PASSWORD}\\\"}\";
      /usr/local/bin/kibana-docker"

    volumes:
      - ../kms/ca.crt:/kms/ca.crt:ro
      - siem_certs:/tmpfs/certs:ro


  filebeat:
    image: docker.elastic.co/beats/filebeat:8.13.0
    container_name: payshield_filebeat
    user: root

    depends_on:
      vault-agent-controller:
        condition: service_healthy

    command: filebeat -e -strict.perms=false

    volumes:
      - ../siem/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../kms/ca.crt:/etc/certs/ca.crt:ro
      - siem_certs:/tmpfs/certs:ro


  redis:
      image: redis:7.0-alpine
      container_name: payshield_redis
      ports:
        - "6300:6379"


volumes:
  payshield_mysql_data:
  payshield_vault_data:
  payshield_siem_data:
  client_certs:
    driver: local
    driver_opts: { type: tmpfs, device: tmpfs }
  kong_certs:
    driver: local
    driver_opts: { type: tmpfs, device: tmpfs }
  waf_certs:
    driver: local
    driver_opts: { type: tmpfs, device: tmpfs }
  keycloak_certs:
    driver: local
    driver_opts: { type: tmpfs, device: tmpfs }
  nginx_certs:
    driver: local
    driver_opts: { type: tmpfs, device: tmpfs }
  app_certs:
    driver: local
    driver_opts: { type: tmpfs, device: tmpfs }
  db_certs:
    driver: local
    driver_opts: { type: tmpfs, device: tmpfs }
  siem_certs:
    driver: local
    driver_opts: { type: tmpfs, device: tmpfs }
