<VirtualHost *:443>
    DocumentRoot /var/www/html/public
    ServerName payshield_app

    SSLEngine on
    SSLCertificateFile    /etc/ssl/certs/laravel.crt
    SSLCertificateKeyFile /etc/ssl/private/laravel.key
    SSLCertificateChainFile /etc/ssl/certs/ca.crt

    SSLVerifyClient require
    SSLVerifyDepth 2
    SSLCACertificateFile /etc/ssl/certs/ca.crt

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>