<VirtualHost *:443>
    DocumentRoot /var/www/html/public
    ServerName payshield_app

    SSLEngine on
    SSLCertificateFile    /tmpfs/certs/server.crt
    SSLCertificateKeyFile /tmpfs/certs/server.key
    SSLCertificateChainFile /kms/ca.crt

    SSLVerifyClient require
    SSLVerifyDepth 2
    SSLCACertificateFile /kms/ca.crt

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>